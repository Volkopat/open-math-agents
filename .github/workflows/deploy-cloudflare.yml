name: deploy-cloudflare
# Builds the site for Cloudflare Workers (vinext), refreshes the D1 catalogue when it changed, and deploys.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit). Runs only on pushes to this
# repository's branches, never on pull requests from forks, so the token is never exposed to outside code.
# Code changes are deployed by Cloudflare Workers Builds (connected to this repository, branch main, same build command,
# about 3 minutes after a push, without GitHub's runner queue; it ignores proofs/, reductions/, statements/ and tools/).
# This workflow covers what Workers Builds skips and only it can do: new statements and catalogue data (a D1 refresh,
# then a deploy). It waits in the runner queue and keeps one run pending, so many statement merges make one deploy.
on:
  push:
    branches: [main]
    # Since the move to lefttosolve2 (28 Nov) Cloudflare Workers Builds no longer sees this repository, so this
    # workflow deploys code changes too (app, components, lib, content, worker, public, config).
    paths: ["statements/**", "data/**", "scripts/**", "app/**", "components/**", "lib/**", "content/**", "worker/**", "public/**", "types/**", "package.json", "package-lock.json", "next.config.mjs", "vite.config.ts", "cloudflare.config.ts"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
env:
  CLOUDFLARE_ACCOUNT_ID: 53a1c594a629cbe458d0e0c26091eae3
  D1_CATALOG_ID: 740a3c15-d8dd-460c-bcdd-938e38df77b7
  NEXT_PUBLIC_SITE_URL: https://lefttosolve.com
  NEXT_PUBLIC_SUPPORT_URL: https://ko-fi.com/guillaumebaud
  NEXT_PUBLIC_SPONSOR_URL: https://ko-fi.com/guillaumebaud
  # Optional, set as repository variables once live: a Stripe Payment Link (card, any country) and the GitHub Sponsors page.
  NEXT_PUBLIC_CARD_URL: ${{ vars.CARD_URL }}
  NEXT_PUBLIC_GITHUB_SPONSORS_URL: ${{ vars.GITHUB_SPONSORS_URL }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The latest main, not the commit that triggered the run: a run waits up to an hour behind the proof checks in
      # the runner queue, and deploying its own (old) commit then rolled the site back over newer code that Workers
      # Builds had deployed meanwhile (on 27 Nov, 23:46 UTC, a run of 23:07 undid three fixes pushed at 23:37).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the catalogue (cards in memory, the rest for D1)
        run: node scripts/build_statements.mjs && node scripts/build_data.mjs
      - name: Refresh the D1 catalogue if its version changed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/seed_d1.mjs --remote "$CLOUDFLARE_ACCOUNT_ID" "$D1_CATALOG_ID" --if-changed
          node scripts/seed_d1.mjs --remote "$CLOUDFLARE_ACCOUNT_ID" "$D1_CATALOG_ID" --if-changed --part mo
      - name: Build and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # --force: the repository is the source of truth; it overrides edits made in the dashboard or the API
        # (secrets are separate and are kept).
        run: npx vite build && npx cf deploy --mode production --force
      - name: Smoke test
        run: |
          base=https://open-math-agents.openmathagents.workers.dev
          for p in / /api/stats "/api/problems?q=collatz&limit=1" /sponsors; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p"); echo "$p $code"; [ "$code" = 200 ] || exit 1
          done
      # Warm-up (28 Nov: /solved rendered in 1.4-1.6 s cold, much worse under load): the page cache key includes the
      # build, so every deploy leaves each colo cold. A couple of plain GETs per main page warm at least this runner's
      # colo and the Worker isolate's caches before visitors arrive. Never fails the deploy.
      - name: Warm up the main pages
        if: success()
        continue-on-error: true
        run: |
          for round in 1 2; do
            for p in / /solved /live /prizes /labs /contributors; do
              curl -s -o /dev/null -m 30 -w "round $round $p %{http_code} %{time_total}s\n" "https://lefttosolve.com$p" || true
            done
          done
